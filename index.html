<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Synt — Turn ideas into software</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #05070a;
            --bg-secondary: #0c1017;
            --border: #1e2636;
            --text-primary: #f0f2f5;
            --text-secondary: #8b949e;
            --accent: #7ee787;
            --accent-solid: #7ee787;
            --accent-glow: rgba(126, 231, 135, 0.4);
            --gradient: linear-gradient(135deg, #7ee787, #58a6ff);
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 2.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo svg { width: 36px; height: 36px; }
        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .lang-selector { display: flex; gap: 0.5rem; }
        .lang-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: var(--accent-solid);
            color: #05070a;
            border-color: var(--accent-solid);
        }
        h1 { font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem; font-weight: 700; }
        .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem; }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .api-section, .model-section, .framework-section, .theme-section, .logo-section {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .config-grid label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .config-grid select, .config-grid input[type="password"], .config-grid input[type="file"] {
            padding: 0.7rem 0.8rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: white;
            font-weight: 500;
            font-size: 0.85rem;
            width: 100%;
        }
        .config-grid select { cursor: pointer; }
        .api-key-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .api-key-row input { flex: 1; }
        .api-key-row button {
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            background: var(--accent-solid);
            color: #05070a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .logo-preview { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: var(--bg-primary); border: 1px solid var(--border); }
        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            height: 120px;
            margin-bottom: 1.5rem;
        }
        .btn-generate {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: var(--gradient);
            border: none;
            color: #05070a;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
            margin-bottom: 1.5rem;
        }
        .btn-generate:active { transform: scale(0.98); }
        .btn-generate:hover { box-shadow: 0 0 30px var(--accent-glow); }
        .result-area { margin-top: 1rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab {
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: var(--accent-solid); color: #05070a; border-color: var(--accent-solid); }
        .code-block {
            background: #000;
            border-radius: 12px;
            padding: 1rem;
            max-height: 350px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
            color: #7ee787;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
        .preview-frame {
            width: 100%;
            height: 400px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            display: none;
        }
        .actions { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; flex-wrap: wrap; }
        .actions button {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
        }
        .actions button:hover { background: #1a1f2b; }
        .status { text-align: center; margin-top: 1rem; font-weight: 500; }
        .footer { text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.75rem; }
        @media (max-width: 768px) {
            .container { padding: 1.5rem; }
            .top-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="logo">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7ee787;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
                    <circle cx="50" cy="50" r="8" fill="url(#logoGrad)"/>
                    <line x1="30" y1="30" x2="46" y2="46" stroke="url(#logoGrad)" stroke-width="3"/>
                    <line x1="70" y1="30" x2="54" y2="46" stroke="url(#logoGrad)" stroke-width="3"/>
                    <line x1="50" y1="70" x2="50" y2="58" stroke="url(#logoGrad)" stroke-width="3"/>
                </svg>
                <span class="logo-text">synt</span>
            </div>
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="en">🇺🇸 EN</button>
                <button class="lang-btn" data-lang="pt">🇧🇷 PT</button>
            </div>
        </div>

        <h1 data-i18n="headline">Turn ideas into software</h1>
        <p class="subtitle" data-i18n="subtitle">Describe your tool, choose a framework, theme, and even upload your logo. Synt generates a complete HTML file. Test live before download.</p>

        <!-- Grade de configurações -->
        <div class="config-grid">
            <div class="api-section">
                <label data-i18n="provider">Provider</label>
                <select id="apiProvider" onchange="onProviderChange()">
                    <option value="gemini">Gemini (Google)</option>
                    <option value="openai">OpenAI</option>
                    <option value="claude">Claude (Anthropic)</option>
                </select>
            </div>
            <div class="model-section">
                <label data-i18n="model">Model</label>
                <select id="llmModel"></select>
            </div>
            <div class="framework-section">
                <label data-i18n="framework">Framework</label>
                <select id="framework">
                    <option value="vanilla">Vanilla HTML/JS</option>
                    <option value="vue">Vue 3 + Tailwind</option>
                    <option value="react">React + Tailwind</option>
                </select>
            </div>
            <div class="theme-section">
                <label data-i18n="theme">Visual Theme</label>
                <select id="theme">
                    <option value="dark-elegant">Dark Elegant</option>
                    <option value="corporate">Corporate</option>
                    <option value="minimalist">Minimalist</option>
                    <option value="modern">Modern</option>
                </select>
            </div>
            <div class="logo-section">
                <label data-i18n="logoLabel">Your Logo</label>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="file" id="logoUpload" accept="image/png,image/jpeg,image/svg+xml" onchange="handleLogoUpload()">
                    <img id="logoPreview" class="logo-preview" alt="" style="display:none;">
                </div>
            </div>
        </div>

        <!-- Linha da chave API -->
        <div class="api-key-row" style="margin-bottom: 1.5rem;">
            <input type="password" id="apiKey" placeholder="API Key">
            <button onclick="saveKey()" data-i18n="saveBtn">Save</button>
        </div>

        <label for="prompt" data-i18n="promptLabel">Describe your tool</label>
        <textarea id="prompt" data-i18n-placeholder="placeholderDesc" placeholder="Ex: A quotation generator for my bakery..."></textarea>

        <button class="btn-generate" onclick="generateTool()" data-i18n="generateBtn">✨ Generate Software</button>

        <div class="status" id="status"></div>

        <div class="result-area" id="resultArea" style="display: none;">
            <div class="tabs">
                <button class="tab active" onclick="showTab('code')" data-i18n="tabCode">🧬 Code</button>
                <button class="tab" onclick="showTab('preview')" data-i18n="tabPreview">👁️ Live Preview</button>
            </div>
            <div class="code-block" id="codeBlock" style="display: block;"></div>
            <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
            <div class="actions">
                <button onclick="copyCode()" data-i18n="copyBtn">📋 Copy Code</button>
                <button onclick="downloadHTML()" data-i18n="downloadBtn">⬇️ Download .html</button>
            </div>
        </div>

        <div class="footer">
            <p data-i18n="footerText">Synt uses your own API key. Nothing is stored on any server.</p>
        </div>
    </div>

    <script>
        // ============ SEGURANÇA ============
        (function() {
            const allowedDomains = ['synt.digital', 'localhost', '127.0.0.1', 'synt-git-main.vercel.app', 'synt.vercel.app'];
            const currentHost = window.location.hostname;
            if (!allowedDomains.some(domain => currentHost.endsWith(domain))) {
                document.body.innerHTML = '<div style="color:red;text-align:center;padding:2rem;">Unauthorized domain</div>';
                throw new Error('Domain not authorized');
            }

            // Detecção de DevTools (menos invasiva, apenas avisa no console)
            const devToolsCheck = setInterval(() => {
                const start = performance.now();
                debugger;
                const end = performance.now();
                if (end - start > 100) {
                    console.clear();
                    console.log('%c⚠️ DevTools detected. Synt source code is protected.', 'color: #ff6b6b; font-size: 1.2rem;');
                }
            }, 6000);
        })();

        // ============ DICIONÁRIO DE IDIOMAS ============
        const i18n = {
            en: {
                headline: "Turn ideas into software",
                subtitle: "Describe your tool, choose a framework, theme, and even upload your logo. Synt generates a complete HTML file. Test live before download.",
                saveBtn: "Save",
                promptLabel: "Describe your tool",
                placeholderDesc: "Ex: A quotation generator for my bakery...",
                generateBtn: "✨ Generate Software",
                tabCode: "🧬 Code",
                tabPreview: "👁️ Live Preview",
                copyBtn: "📋 Copy Code",
                downloadBtn: "⬇️ Download .html",
                footerText: "Synt uses your own API key. Nothing is stored on any server.",
                provider: "Provider",
                model: "Model",
                framework: "Framework",
                theme: "Visual Theme",
                logoLabel: "Your Logo",
                alertKeySaved: "Key saved!",
                alertNoKey: "Please provide your API key first.",
                alertNoPrompt: "Describe the tool you want to generate.",
                generating: "⏳ Generating your software...",
                success: "✅ Software generated successfully!",
                copying: "Copied!",
            },
            pt: {
                headline: "Transforme ideias em software",
                subtitle: "Descreva sua ferramenta, escolha framework, tema e até envie sua logo. O Synt gera um HTML completo. Teste ao vivo antes de baixar.",
                saveBtn: "Salvar",
                promptLabel: "Descreva sua ferramenta",
                placeholderDesc: "Ex: Um gerador de orçamentos para minha padaria...",
                generateBtn: "✨ Gerar Software",
                tabCode: "🧬 Código",
                tabPreview: "👁️ Preview ao Vivo",
                copyBtn: "📋 Copiar Código",
                downloadBtn: "⬇️ Baixar .html",
                footerText: "O Synt usa sua própria chave de API. Nada é armazenado em servidor.",
                provider: "Provedor",
                model: "Modelo",
                framework: "Framework",
                theme: "Tema Visual",
                logoLabel: "Sua Logo",
                alertKeySaved: "Chave salva!",
                alertNoKey: "Por favor, informe sua chave de API primeiro.",
                alertNoPrompt: "Descreva a ferramenta que deseja gerar.",
                generating: "⏳ Gerando seu software...",
                success: "✅ Software gerado com sucesso!",
                copying: "Copiado!",
            }
        };

        let currentLang = 'en';
        let generatedCode = '';
        let userLogoBase64 = '';

        // Modelos por provedor
        const modelsByProvider = {
            gemini: [
                { id: 'gemini-2.0-flash', name: 'Gemini 2.0 Flash (Fast/Free)' },
                { id: 'gemini-2.5-pro-exp-03-25', name: 'Gemini 2.5 Pro (Advanced)' }
            ],
            openai: [
                { id: 'gpt-4o-mini', name: 'GPT-4o Mini (Cheap)' },
                { id: 'gpt-4o', name: 'GPT-4o (Most Capable)' }
            ],
            claude: [
                { id: 'claude-3-haiku-20240307', name: 'Claude 3 Haiku (Fast)' },
                { id: 'claude-3-sonnet-20240229', name: 'Claude 3 Sonnet (Balanced)' },
                { id: 'claude-3-opus-20240229', name: 'Claude 3 Opus (Powerful)' }
            ]
        };

        // Guias de tema visual
        const themeGuides = {
            'dark-elegant': `Use a dark elegant theme: background #0c1017, text #f0f2f5, accent #7ee787, secondary #8b949e.
            Rounded corners (16px), glassmorphism effects, gradients, subtle shadows, modern typography (Inter or system-ui).
            Cards with bg #1a1f2b, borders #2a2e3a. Buttons with gradient and glow effect. Smooth transitions.
            This is the "Synt" design system.`,

            'corporate': `Use a corporate professional theme: background white or #f8f9fa, text #1a1a2e, primary #003366, accent #0066cc.
            Clean straight lines, subtle borders, professional typography (Segoe UI or system-ui).
            Cards with light shadow, structured layout, minimal animations. Trustworthy and serious.`,

            'minimalist': `Use a minimalist theme: abundant white space, background #ffffff, text #333, accent a single vibrant color like #ff6b6b or #4ecdc4.
            Thin borders, large serif or clean sans-serif typography, very few elements. Focus on content.
            No shadows, no gradients. Pure and essential.`,

            'modern': `Use a modern vibrant theme: background #f5f7fa, text #1e293b, accent gradient from #7c3aed to #2563eb.
            Colorful cards, rounded corners (12px), playful shadows, lively typography (system-ui).
            Buttons with bold colors, animated interactions, clean but energetic design.`
        };

        // Guias de framework
        const frameworkGuides = {
            'vanilla': `Use vanilla HTML, CSS (inline in <style>), and JavaScript (inline in <script>). No external dependencies.`,

            'vue': `Use Vue 3 via CDN (<script src="https://unpkg.com/vue@3/dist/vue.global.js">) and Tailwind CSS via CDN (<script src="https://cdn.tailwindcss.com">).
            Build the whole app as a single Vue 3 component with reactive data, computed properties, and methods.
            Use Tailwind classes for all styling.`,

            'react': `Use React via CDN (<script src="https://unpkg.com/react@18/umd/react.production.min.js"> and react-dom) and Tailwind CSS via CDN.
            Build the app using React.createElement or JSX via Babel standalone (<script src="https://unpkg.com/@babel/standalone/babel.min.js">).
            Create functional components with hooks (useState, useEffect). Use Tailwind classes for all styling.`
        };

        // ============ FUNÇÕES DE INTERFACE ============
        function onProviderChange() {
            const provider = document.getElementById('apiProvider').value;
            const modelSelect = document.getElementById('llmModel');
            modelSelect.innerHTML = '';
            modelsByProvider[provider].forEach(model => {
                const opt = document.createElement('option');
                opt.value = model.id;
                opt.textContent = model.name;
                modelSelect.appendChild(opt);
            });
            const savedKey = localStorage.getItem(`synt_key_${provider}`);
            document.getElementById('apiKey').value = savedKey || '';
            document.getElementById('apiKey').placeholder = provider === 'gemini' ? 'Gemini API Key' :
                                                           provider === 'openai' ? 'OpenAI API Key' : 'Claude API Key';
        }

        function saveKey() {
            const provider = document.getElementById('apiProvider').value;
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem(`synt_key_${provider}`, key);
                alert(i18n[currentLang].alertKeySaved);
            }
        }

        function switchLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) {
                    el.textContent = i18n[lang][key];
                }
            });
            const promptField = document.getElementById('prompt');
            if (promptField && i18n[lang].placeholderDesc) {
                promptField.placeholder = i18n[lang].placeholderDesc;
            }
            document.querySelectorAll('.tab').forEach(tab => {
                if (tab.textContent.includes('Code') || tab.textContent.includes('Código')) {
                    tab.textContent = i18n[lang].tabCode;
                } else if (tab.textContent.includes('Preview') || tab.textContent.includes('Ao Vivo')) {
                    tab.textContent = i18n[lang].tabPreview;
                }
            });
        }

        function handleLogoUpload() {
            const file = document.getElementById('logoUpload').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                userLogoBase64 = e.target.result;
                const preview = document.getElementById('logoPreview');
                preview.src = userLogoBase64;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                switchLanguage(this.dataset.lang);
            });
        });

        // ============ GERAÇÃO DE CÓDIGO ============
        async function generateTool() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return alert(i18n[currentLang].alertNoKey);

            const userPrompt = document.getElementById('prompt').value.trim();
            if (!userPrompt) return alert(i18n[currentLang].alertNoPrompt);

            const status = document.getElementById('status');
            status.textContent = i18n[currentLang].generating;
            document.getElementById('resultArea').style.display = 'none';

            const provider = document.getElementById('apiProvider').value;
            const model = document.getElementById('llmModel').value;
            const framework = document.getElementById('framework').value;
            const theme = document.getElementById('theme').value;

            const frameworkGuide = frameworkGuides[framework];
            const themeGuide = themeGuides[theme];

            const logoInstruction = userLogoBase64
                ? `\n\nIMPORTANT: The user has provided their logo as base64. Embed it in the header of the generated HTML using: <img src="${userLogoBase64}" alt="Logo" style="height:40px;">.`
                : '';

            const systemInstruction = `You are an expert frontend developer and UI designer. Generate a complete, standalone HTML file based on the user's request.

STRICT RULES:
- Output ONLY raw HTML code. No markdown, no explanations.
- Start with <!DOCTYPE html>.
- Follow EXACTLY the framework and theme specified below.

FRAMEWORK:
${frameworkGuide}

THEME:
${themeGuide}
${logoInstruction}

USER REQUEST:`;

            const fullPrompt = systemInstruction + '\n\n' + userPrompt;

            try {
                const generated = await callLLM(provider, apiKey, model, fullPrompt);
                let cleaned = generated.trim();
                cleaned = cleaned.replace(/^```html\s*/i, '').replace(/```$/i, '').trim();

                if (!cleaned.startsWith('<!DOCTYPE html>') && !cleaned.startsWith('<html')) {
                    throw new Error('Generated code is invalid. Please try again.');
                }

                generatedCode = cleaned;
                document.getElementById('codeBlock').textContent = cleaned;
                document.getElementById('resultArea').style.display = 'block';
                showTab('code');
                status.textContent = i18n[currentLang].success;
            } catch (err) {
                status.textContent = `❌ ${err.message}`;
            }
        }

        async function callLLM(provider, apiKey, model, prompt) {
            if (provider === 'gemini') {
                const endpoint = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${apiKey}`;
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.2, maxOutputTokens: 8192 }
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || 'Gemini error');
                return data.candidates[0].content.parts[0].text;
            }

            if (provider === 'openai') {
                const res = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.2,
                        max_tokens: 8192
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || 'OpenAI error');
                return data.choices[0].message.content;
            }

            if (provider === 'claude') {
                const res = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: model,
                        max_tokens: 8192,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || 'Claude error');
                return data.content[0].text;
            }

            throw new Error('Unknown provider');
        }

        function showTab(tab) {
            const codeBlock = document.getElementById('codeBlock');
            const previewFrame = document.getElementById('previewFrame');
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));

            if (tab === 'code') {
                codeBlock.style.display = 'block';
                previewFrame.style.display = 'none';
                document.querySelector('.tab:nth-child(1)').classList.add('active');
            } else {
                codeBlock.style.display = 'none';
                previewFrame.style.display = 'block';
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                previewFrame.srcdoc = generatedCode;
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(generatedCode).then(() => alert(i18n[currentLang].copying));
        }

        function downloadHTML() {
            const blob = new Blob([generatedCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `synt_tool_${Date.now()}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Inicialização
        switchLanguage('en');
        onProviderChange();
    </script>
</body>
</html>
